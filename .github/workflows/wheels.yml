name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist

      - name: Check the archives
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          bindings = [
              "pysos_rpr/_proto/rpr/v2/entity_pb2.py",
              "pysos_rpr/_proto/rpr/v2/platform_pb2.py",
              "pysos_rpr/_proto/rpr/v2/spatial_pb2.py",
          ]
          wheel = next(Path("dist").glob("pysos_rpr-*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = [name for name in bindings if name not in names]
          if missing:
              raise SystemExit(f"{wheel.name} is missing generated bindings: {missing}")

          sdist = next(Path("dist").glob("pysos_rpr-*.tar.gz"))
          with open_tar(sdist) as archive:
              names = {name.split("/", 1)[-1] for name in archive.getnames()}
          required = [
              "proto/rpr/v2/entity.proto",
              "proto/rpr/v2/platform.proto",
              "proto/rpr/v2/spatial.proto",
              "tools/generate_bindings.sh",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit(f"{sdist.name} is missing schema sources: {missing}")

          print(f"{wheel.name} ships {len(bindings)} generated bindings")
          print(f"{sdist.name} ships the proto sources and regeneration script")
          PY

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import os

          import pysos_rpr
          import pysos_rpr.messages as messages

          # On a tag build the tag name without its leading "v" must equal the
          # version the wheel reports; the version is never hardcoded here.
          if os.environ.get("GITHUB_REF", "").startswith("refs/tags/v"):
              version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              assert pysos_rpr.__version__ == version, (
                  f"tag {os.environ['GITHUB_REF_NAME']} does not match "
                  f"built version {pysos_rpr.__version__}"
              )

          assert messages.encode(
              messages.entity_identifier(site=1, application=1, entity=1)
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: dist/*
          fail_on_unmatched_files: true
