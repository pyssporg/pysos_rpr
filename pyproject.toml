[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pysos-rpr"
dynamic = ["version"]
description = "RPR-derived protobuf vocabulary for entity state in system-of-systems simulation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pyssporg contributors" }]
keywords = ["protobuf", "rpr", "entity-state", "simulation", "system-of-systems"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
# The vocabulary adds no runtime dependency yet. Generated bindings and their
# protobuf runtime arrive with the projection work, not in the scaffold.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "src/pysos_rpr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pysos_rpr"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
xfail_strict = true
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
