[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pysos-rpr"
dynamic = ["version"]
description = "RPR-derived protobuf vocabulary for entity state in system-of-systems simulation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pyssporg contributors" }]
keywords = ["protobuf", "rpr", "entity-state", "simulation", "system-of-systems"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
# Generated bindings are a projection of `proto/rpr/v2/`; the protobuf runtime
# is the only dependency they need.
dependencies = ["protobuf>=5.29,<6"]

[project.optional-dependencies]
# grpcio-tools 1.71.2 bundles the protoc that produced the committed bindings;
# keep it exact so regeneration is byte-identical.
dev = ["pytest>=8", "ruff>=0.6", "grpcio-tools==1.71.2"]
# The FMI projection is the only module that imports an artifact implementer
# (DEC-001).  The base install stays vocabulary-only and dependency-free.
# The projection needs the SysML composition layer on top of the generated
# runtime; 0.6.0 moved SysML out of `pyfmi_interop` into `pyfmi_sysml`.
projection = [
  "pyfmi-interop>=0.6.0",
  "pyfmi-sysml>=0.2.0",
]

[tool.hatch.version]
path = "src/pysos_rpr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pysos_rpr"]

# The sdist carries the schema source and the regeneration script so a released
# tarball can rebuild the committed bindings; the wheel carries the bindings.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/proto",
  "/sysml",
  "/tools",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
xfail_strict = true
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# `src/pysos_rpr/_proto` is protoc output; it is regenerated, never linted or
# edited by hand.
extend-exclude = ["src/pysos_rpr/_proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
